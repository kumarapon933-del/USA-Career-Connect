        .logo-box svg { width: 220px; height: auto; display: block; }
        
        nav a { color: white; text-decoration: none; margin-left: 15px; font-size: 14px; }

        .live-chat-btn:hover {
            background-color: #1eb954;
            transform: translateY(-2px);
